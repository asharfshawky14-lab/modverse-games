
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090b0a">
<title>تسجيل الدخول | MODVERSE</title>
<style>
:root{--bg:#090b0a;--panel:#111512;--green:#8cff65;--text:#f2f5f2;--muted:#9ca79e;--border:#242d26}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 15% 10%,#28552a38,transparent 45%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--green);text-decoration:none}
.card{width:min(100%,430px);padding:28px;border:1px solid var(--border);border-radius:20px;background:#101410;box-shadow:0 20px 70px #0007}
.brand{display:flex;justify-content:center;align-items:center;gap:10px;direction:ltr;font-size:26px;font-weight:900;margin-bottom:12px}
.logo{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:var(--green);color:#071006}
.brand span{color:var(--green)}
h1{text-align:center;font-size:23px;margin:10px 0 4px}
.subtitle{text-align:center;color:var(--muted);font-size:13px;margin:0 0 24px}
label{display:block;font-size:13px;margin:14px 0 6px}
input{width:100%;padding:13px 12px;border:1px solid var(--border);border-radius:10px;background:#090b0a;color:var(--text);font:inherit;outline:none}
input:focus{border-color:var(--green)}
button{width:100%;padding:12px;border-radius:10px;font:inherit;font-weight:750;cursor:pointer}
.primary{margin-top:18px;border:0;background:var(--green);color:#071006}
.google{margin-top:10px;border:1px solid var(--border);background:#171c18;color:var(--text)}
button:disabled{opacity:.6;cursor:wait}
.forgot{text-align:left;margin-top:9px;font-size:13px}
.forgot button{width:auto;padding:0;border:0;background:none;color:var(--green);font-weight:500}
.message{display:none;margin-top:14px;padding:11px;border-radius:10px;font-size:13px;overflow-wrap:anywhere}
.message.show{display:block}
.message.error{color:#ffb8b8;background:#321818;border:1px solid #673030}
.message.ok{color:#c7ffb8;background:#172819;border:1px solid #315b30}
.bottom{text-align:center;color:var(--muted);font-size:13px;margin-top:20px}
.back{display:block;text-align:center;margin-top:18px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><div class="logo">M</div><div>MOD<span>VERSE</span></div></div>
  <h1>أهلًا بعودتك</h1>
  <p class="subtitle">سجّل دخولك علشان تكمل رحلتك في MODVERSE</p>

  <form id="loginForm">
    <label for="email">البريد الإلكتروني</label>
    <input id="email" type="email" autocomplete="email" placeholder="name@example.com" required>

    <label for="password">كلمة المرور</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="اكتب كلمة المرور" required>

    <div class="forgot">
      <button id="forgotBtn" type="button">نسيت كلمة المرور؟</button>
    </div>

    <button class="primary" id="loginBtn" type="submit">تسجيل الدخول</button>
  </form>

  <button class="google" id="googleBtn" type="button">المتابعة باستخدام Google</button>
  <div id="message" class="message" role="status" aria-live="polite"></div>

  <p class="bottom">لسه معندكش حساب؟ <a href="register.html">إنشاء حساب جديد</a></p>
  <a class="back" href="./">← الرجوع إلى الصفحة الرئيسية</a>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://aboenvwqlzmbjyqisarb.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_-U554BTwIf6tP-DA9uRgCg_5w5_XtU3";
const HOME_URL = new URL("./", window.location.href).href;
const RESET_URL = new URL("reset-password.html", window.location.href).href;

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const form = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const googleBtn = document.getElementById("googleBtn");
const forgotBtn = document.getElementById("forgotBtn");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const message = document.getElementById("message");

function showMessage(text, type) {
  message.textContent = text;
  message.className = "message show " + type;
}

client.auth.getSession().then(({data, error}) => {
  if (!error && data.session) {
    window.location.replace(HOME_URL);
  }
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  loginBtn.disabled = true;
  googleBtn.disabled = true;
  forgotBtn.disabled = true;
  showMessage("جارٍ تسجيل الدخول…", "ok");

  try {
    const {data, error} = await client.auth.signInWithPassword({
      email: emailInput.value.trim(),
      password: passwordInput.value
    });

    if (error) throw error;

    if (data.session) {
      showMessage("تم تسجيل الدخول بنجاح. جارٍ الرجوع للموقع…", "ok");
      window.location.replace(HOME_URL);
    }
  } catch (error) {
    showMessage(
      error.message === "Invalid login credentials"
        ? "البريد الإلكتروني أو كلمة المرور غير صحيحة."
        : "تعذّر تسجيل الدخول: " + error.message,
      "error"
    );

    loginBtn.disabled = false;
    googleBtn.disabled = false;
    forgotBtn.disabled = false;
  }
});

forgotBtn.addEventListener("click", async () => {
  const email = emailInput.value.trim();

  if (!email) {
    showMessage("اكتب بريدك الإلكتروني الأول، وبعدها اضغط نسيت كلمة المرور.", "error");
    emailInput.focus();
    return;
  }

  if (!emailInput.checkValidity()) {
    showMessage("اكتب بريدًا إلكترونيًا صحيحًا.", "error");
    emailInput.focus();
    return;
  }

  forgotBtn.disabled = true;
  showMessage("جارٍ إرسال رابط استعادة كلمة المرور…", "ok");

  try {
    const {error} = await client.auth.resetPasswordForEmail(email, {
      redirectTo: RESET_URL
    });

    if (error) throw error;

    showMessage(
      "لو البريد مسجل عندنا، هتوصلك رسالة فيها رابط تغيير كلمة المرور. راجع صندوق الوارد والرسائل غير المرغوب فيها.",
      "ok"
    );
  } catch (error) {
    showMessage("تعذّر إرسال رسالة الاستعادة: " + error.message, "error");
  } finally {
    forgotBtn.disabled = false;
  }
});

googleBtn.addEventListener("click", async () => {
  googleBtn.disabled = true;
  showMessage("جارٍ فتح تسجيل الدخول باستخدام Google…", "ok");

  try {
    const {error} = await client.auth.signInWithOAuth({
      provider: "google",
      options: {redirectTo: HOME_URL}
    });

    if (error) throw error;
  } catch (error) {
    googleBtn.disabled = false;
    showMessage("تعذّر بدء تسجيل الدخول بـ Google: " + error.message, "error");
  }
});
</script>
</body>
</html>
