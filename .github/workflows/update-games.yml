
name: MODVERSE Auto Update

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "update_games.py"
      - "games.json"
      - ".github/workflows/update-games.yml"
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  update-games:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run game collector
        run: python update_games.py

      - name: Save updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json
          git diff --cached --quiet || git commit -m "Update MODVERSE game catalog"
          git push
