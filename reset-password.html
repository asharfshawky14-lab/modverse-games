
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090b0a">
<title>استعادة كلمة المرور | MODVERSE</title>
<style>
:root {
  --bg: #090b0a;
  --green: #8cff65;
  --text: #f2f5f2;
  --muted: #9ca79e;
  --border: #242d26;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  background: radial-gradient(ellipse at 15% 10%, #28552a38, transparent 45%), var(--bg);
  color: var(--text);
  font-family: system-ui, sans-serif;
}
.card {
  width: min(100%, 430px);
  padding: 28px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: #101410;
}
.brand {
  text-align: center;
  direction: ltr;
  font-size: 27px;
  font-weight: 900;
}
.brand span { color: var(--green); }
h1 { text-align: center; font-size: 22px; }
p { color: var(--muted); font-size: 14px; line-height: 1.8; }
label { display: block; margin: 16px 0 7px; font-size: 13px; }
input {
  width: 100%;
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #090b0a;
  color: var(--text);
  font: inherit;
}
button {
  width: 100%;
  padding: 13px;
  margin-top: 18px;
  border: 0;
  border-radius: 10px;
  background: var(--green);
  color: #071006;
  font: inherit;
  font-weight: 800;
  cursor: pointer;
}
button:disabled { opacity: .6; }
.message {
  display: none;
  margin-top: 15px;
  padding: 12px;
  border-radius: 10px;
  font-size: 13px;
  overflow-wrap: anywhere;
}
.message.show { display: block; }
.error { color: #ffb8b8; background: #321818; }
.ok { color: #c7ffb8; background: #172819; }
a { color: var(--green); text-decoration: none; }
.back { display: block; text-align: center; margin-top: 20px; }
</style>
</head>
<body>
<main class="card">
  <div class="brand">MOD<span>VERSE</span></div>
  <h1>تعيين كلمة مرور جديدة</h1>
  <p>اكتب كلمة المرور الجديدة بعد فتح رابط الاستعادة الذي وصلك على بريدك الإلكتروني.</p>

  <form id="resetForm">
    <label for="password">كلمة المرور الجديدة</label>
    <input id="password" type="password" minlength="8"
      autocomplete="new-password" placeholder="8 أحرف على الأقل" required>

    <label for="confirmPassword">تأكيد كلمة المرور</label>
    <input id="confirmPassword" type="password" minlength="8"
      autocomplete="new-password" placeholder="اكتبها مرة أخرى" required>

    <button id="submitBtn" type="submit">حفظ كلمة المرور الجديدة</button>
  </form>

  <div id="message" class="message" role="status" aria-live="polite"></div>
  <a class="back" href="login.html">الرجوع إلى تسجيل الدخول</a>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://aboenvwqlzmbjyqisarb.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_-U554BTwIf6tP-DA9uRgCg_5w5_XtU3";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);

const form = document.getElementById("resetForm");
const submitBtn = document.getElementById("submitBtn");
const message = document.getElementById("message");

function showMessage(text, type) {
  message.textContent = text;
  message.className = "message show " + type;
}

let recoveryReady = false;

client.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY" && session) {
    recoveryReady = true;
    showMessage("تم التحقق من رابط الاستعادة. اكتب كلمة المرور الجديدة.", "ok");
  }
});

async function checkRecoverySession() {
  const hash = new URLSearchParams(
    window.location.hash.replace(/^#/, "")
  );

  if (hash.get("error_description")) {
    showMessage(
      "رابط الاستعادة غير صالح أو انتهت صلاحيته. اطلب رسالة جديدة.",
      "error"
    );
    return;
  }

  const { data, error } = await client.auth.getSession();

  if (!error && data.session) {
    recoveryReady = true;
    showMessage("اكتب كلمة المرور الجديدة ثم اضغط حفظ.", "ok");
  } else {
    showMessage("افتح صفحة الاستعادة من الرابط الموجود في رسالة البريد الإلكتروني.", "error");
  }
}

checkRecoverySession();

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (password.length < 8) {
    showMessage("كلمة المرور لازم تكون 8 أحرف على الأقل.", "error");
    return;
  }

  if (password !== confirmPassword) {
    showMessage("كلمتا المرور غير متطابقتين.", "error");
    return;
  }

  if (!recoveryReady) {
    showMessage("رابط الاستعادة غير جاهز أو انتهت صلاحيته. اطلب رسالة جديدة.", "error");
    return;
  }

  submitBtn.disabled = true;
  showMessage("جارٍ تحديث كلمة المرور…", "ok");

  const { error } = await client.auth.updateUser({ password });

  if (error) {
    showMessage("تعذر تغيير كلمة المرور: " + error.message, "error");
    submitBtn.disabled = false;
    return;
  }

  await client.auth.signOut();
  showMessage("تم تغيير كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول بكلمتك الجديدة.", "ok");
  form.reset();
  submitBtn.textContent = "تم تغيير كلمة المرور";
});
</script>
</body>
</html>
